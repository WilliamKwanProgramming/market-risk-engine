[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mre"
version = "0.1.0"
description = "Market-risk engine: VaR and expected shortfall models, full revaluation, backtests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
data = ["skfolio>=0.7", "arch>=7.0"]
test = ["pytest>=8.0", "arch>=7.0", "ruff>=0.5"]
dashboard = ["streamlit>=1.30", "altair>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
